<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ng2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An Angular starter with a MapLibre map: five free map themes and a 3D view.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before the first paint, so dark mode does not flash light.
    // Mirrors midnite-ui's themeInitScript: `html.dark` plus color-scheme. Keep the key
    // and the values in step with UiThemeService.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('ws-ui-theme'); } catch (e) {}
      var resolved = saved === 'light' || saved === 'dark' ? saved
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var root = document.documentElement;
      root.classList.toggle('dark', resolved === 'dark');
      root.style.colorScheme = resolved;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
