<ws-map
  [center]="center()"
  [zoom]="zoom()"
  [theme]="themeId()"
  [threeD]="threeD()"
  [satelliteLabels]="labels()"
  (moveEnd)="rememberView($event)"
/>

<mn-panel
  class="panel"
  heading="Map"
  icon="layers"
  [summary]="activeTheme().label + (threeD() ? ' · 3D' : '')"
  [(open)]="panelOpen"
>
  <mn-segmented label="Theme" [options]="themeOptions" [columns]="3" [(value)]="themeChoice" />
  <p class="note">
    {{ themeChoice() === 'auto' ? 'Follows the app theme: ' : '' }}{{ activeTheme().source }}
  </p>

  <div class="switches">
    <ws-toggle label="3D view" [(checked)]="threeD" />
    @if (themeId() === 'satellite') {
      <ws-toggle label="Place labels" [(checked)]="labels" />
    }
  </div>

  <div>
    <span class="mn-eyebrow mb-1.5 block" id="places-label">Fly to</span>
    <div class="flex flex-wrap gap-1.5" role="group" aria-labelledby="places-label">
      @for (place of places; track place.name) {
        <button type="button" mnChip size="md" [interactive]="true" (click)="flyTo(place)">
          {{ place.name }}
        </button>
      }
    </div>
  </div>

  <ws-point (changed)="goToSearchResult($event)" />

  <div class="flex items-center justify-between gap-2">
    <p class="note">{{ hint() }}</p>
    <button
      type="button"
      mnButton
      variant="ghost"
      size="sm"
      class="-mr-2 shrink-0"
      (click)="clearPins()"
    >
      Clear
    </button>
  </div>
</mn-panel>
