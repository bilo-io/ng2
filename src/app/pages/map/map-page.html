<ws-map
  [center]="center()"
  [zoom]="zoom()"
  [theme]="themeId()"
  [threeD]="threeD()"
  [satelliteLabels]="labels()"
  (moveEnd)="rememberView($event)"
/>

<section class="panel" [class.collapsed]="!panelOpen()" aria-label="Map settings">
  <button
    type="button"
    class="panel-toggle"
    [attr.aria-expanded]="panelOpen()"
    aria-controls="map-panel-body"
    (click)="panelOpen.set(!panelOpen())"
  >
    <span>Map</span>
    <span class="current">{{ activeTheme().label }}{{ threeD() ? ' · 3D' : '' }}</span>
    <span aria-hidden="true">{{ panelOpen() ? '▴' : '▾' }}</span>
  </button>

  <div class="panel-body" id="map-panel-body" [hidden]="!panelOpen()">
    <fieldset class="themes">
      <legend>Theme</legend>
      <label class="theme-option" [class.checked]="themeChoice() === 'auto'">
        <input
          type="radio"
          name="map-theme"
          value="auto"
          [checked]="themeChoice() === 'auto'"
          (change)="chooseTheme('auto')"
        />
        Auto
      </label>
      @for (theme of themes; track theme.id) {
        <label class="theme-option" [class.checked]="themeChoice() === theme.id">
          <input
            type="radio"
            name="map-theme"
            [value]="theme.id"
            [checked]="themeChoice() === theme.id"
            (change)="chooseTheme(theme.id)"
          />
          {{ theme.label }}
        </label>
      }
    </fieldset>
    <p class="source">
      {{ themeChoice() === 'auto' ? 'Follows the app theme: ' : '' }}{{ activeTheme().source }}
    </p>

    <ws-toggle label="3D view" [(checked)]="threeD" />
    @if (themeId() === 'satellite') {
      <ws-toggle label="Place labels" [(checked)]="labels" />
    }

    <div class="group">
      <span class="group-label" id="places-label">Fly to</span>
      <div class="places" role="group" aria-labelledby="places-label">
        @for (place of places; track place.name) {
          <button type="button" class="chip" (click)="flyTo(place)">{{ place.name }}</button>
        }
      </div>
    </div>

    <ws-point (changed)="goToSearchResult($event)" />

    <p class="hint">
      {{ hint() }}
      <button type="button" class="link" (click)="clearPins()">Clear</button>
    </p>
  </div>
</section>
